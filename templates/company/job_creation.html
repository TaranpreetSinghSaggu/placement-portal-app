<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job - Company Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('company_dash') }}">
                <i class="fas fa-building"></i> Company Portal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('job_creation') }}">
                            <i class="fas fa-plus-circle"></i> Post Job
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('company_applications') }}">
                            <i class="fas fa-file-alt"></i> Applications
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('company_interviews') }}">
                            <i class="fas fa-calendar-check"></i> Interviews
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm ms-2">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="job-form-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="form-card">
                        <h2><i class="fas fa-briefcase"></i> Create New Job Posting</h2>
                        
                        <div class="info-box">
                            <i class="fas fa-info-circle"></i> 
                            <strong>Note:</strong> Your job posting will be sent to admin for approval before it becomes visible to students.
                        </div>

                        <form method="POST">
                            <div class="mb-3">
                                <label for="job_title" class="form-label">
                                    <i class="fas fa-heading"></i> Job Title *
                                </label>
                                <input type="text" class="form-control" id="job_title" name="job_title" 
                                       placeholder="e.g., Software Developer, Data Analyst" required>
                            </div>

                            <div class="mb-3">
                                <label for="job_description" class="form-label">
                                    <i class="fas fa-align-left"></i> Job Description *
                                </label>
                                <textarea class="form-control" id="job_description" name="job_description" 
                                          rows="5" placeholder="Describe the role, responsibilities, and requirements..." required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="eligibility" class="form-label">
                                    <i class="fas fa-check-circle"></i> Eligibility Criteria
                                </label>
                                <textarea class="form-control" id="eligibility" name="eligibility" 
                                          rows="3" placeholder="e.g., BE/B.Tech in CS/IT, CGPA > 7.0"></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="deadline" class="form-label">
                                    <i class="fas fa-calendar-alt"></i> Application Deadline *
                                </label>
                                <input type="datetime-local" class="form-control" id="deadline" name="deadline" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="submit-btn">
                                    <i class="fas fa-paper-plane"></i> Submit for Approval
                                </button>
                                <a href="{{ url_for('company_dash') }}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
