{% extends "base.html" %}

{% block title %}Company Registration - Placement Portal{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white text-center">
                    <h4>Company Registration</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('company_register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="hr_contact" class="form-label">HR Contact Name</label>
                            <input type="text" class="form-control" id="hr_contact" name="hr_contact" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="website" class="form-label">Website (Optional)</label>
                            <input type="text" class="form-control" id="website" name="website">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="alert alert-warning">
                            <small>Note: Your account will be activated after admin approval.</small>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-info text-white">Register</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>Already have an account? <a href="{{ url_for('company_login') }}">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
